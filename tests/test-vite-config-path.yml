name: Test vite-config-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create vite config and coverage files
        run: |
          mkdir -p coverage
          cat > vite.config.ts << 'EOF'
          import { defineConfig } from 'vite'
          export default defineConfig({
            test: {
              coverage: {
                reporter: ['json-summary', 'json']
              }
            }
          })
          EOF
          cat > coverage/coverage-summary.json << 'EOF'
          {
            "total": {
              "lines": { "total": 50, "covered": 45, "skipped": 0, "pct": 90 },
              "statements": { "total": 50, "covered": 45, "skipped": 0, "pct": 90 },
              "functions": { "total": 10, "covered": 9, "skipped": 0, "pct": 90 },
              "branches": { "total": 20, "covered": 18, "skipped": 0, "pct": 90 }
            }
          }
          EOF
          cat > coverage/coverage-final.json << 'EOF'
          {}
          EOF

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          vite-config-path: vite.config.ts
          json-summary-path: coverage/coverage-summary.json
          json-final-path: coverage/coverage-final.json
          file-coverage-mode: none
          comment-on: none
        continue-on-error: true

      - name: Assert action completed
        run: |
          echo "Action step outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "FAIL: action failed unexpectedly when vite-config-path is provided"
            exit 1
          fi
          echo "PASS"
