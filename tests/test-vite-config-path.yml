name: Test vite-config-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create vite config and coverage files
        run: |
          mkdir -p coverage

          # Create a minimal vite config with coverage thresholds
          cat > vite.config.ts << 'EOF'
          import { defineConfig } from 'vite'
          export default defineConfig({
            test: {
              coverage: {
                thresholds: {
                  lines: 70,
                  statements: 70,
                  functions: 70,
                  branches: 70
                }
              }
            }
          })
          EOF

          cat > coverage/coverage-summary.json << 'EOF'
          {
            "total": {
              "lines": { "total": 100, "covered": 80, "skipped": 0, "pct": 80 },
              "statements": { "total": 200, "covered": 160, "skipped": 0, "pct": 80 },
              "functions": { "total": 50, "covered": 40, "skipped": 0, "pct": 80 },
              "branches": { "total": 40, "covered": 32, "skipped": 0, "pct": 80 }
            }
          }
          EOF

          cat > coverage/coverage-final.json << 'EOF'
          {}
          EOF

      - id: action
        uses: .
        with:
          vite-config-path: vite.config.ts
          file-coverage-mode: none
          comment-on: none

      - name: Assert action completed with vite-config-path
        run: |
          echo "Action completed with vite-config-path input"
          echo "PASS"
