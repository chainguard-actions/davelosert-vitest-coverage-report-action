name: Test vite-config-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create vite config file
        run: |
          mkdir -p coverage
          cat > vite.config.ts << 'EOF'
          import { defineConfig } from 'vite'
          export default defineConfig({
            test: {
              coverage: {
                provider: 'v8',
                reporter: ['json-summary', 'json'],
              }
            }
          })
          EOF

      - name: Create coverage summary JSON
        run: |
          cat > coverage/coverage-summary.json << 'EOF'
          {
            "total": {
              "lines": { "total": 100, "covered": 80, "skipped": 0, "pct": 80 },
              "statements": { "total": 100, "covered": 80, "skipped": 0, "pct": 80 },
              "functions": { "total": 20, "covered": 16, "skipped": 0, "pct": 80 },
              "branches": { "total": 40, "covered": 32, "skipped": 0, "pct": 80 }
            }
          }
          EOF

      - name: Create coverage final JSON
        run: |
          cat > coverage/coverage-final.json << 'EOF'
          {}
          EOF

      - id: action
        uses: .
        with:
          vite-config-path: vite.config.ts
          json-summary-path: coverage/coverage-summary.json
          json-final-path: coverage/coverage-final.json
          file-coverage-mode: none
          comment-on: none
        continue-on-error: true

      - name: Assert action ran successfully or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with vite-config-path input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
