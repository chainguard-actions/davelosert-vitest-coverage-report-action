name: Test vite-config-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create vite config file
        run: |
          cat > vitest.config.ts << 'EOF'
          import { defineConfig } from 'vitest/config'
          export default defineConfig({
            test: {
              coverage: {
                provider: 'v8',
                reporter: ['json-summary', 'json'],
              },
            },
          })
          EOF

      - name: Create coverage summary JSON
        run: |
          mkdir -p coverage
          cat > coverage/coverage-summary.json << 'EOF'
          {
            "total": {
              "lines": { "total": 200, "covered": 190, "skipped": 0, "pct": 95 },
              "statements": { "total": 200, "covered": 190, "skipped": 0, "pct": 95 },
              "functions": { "total": 50, "covered": 48, "skipped": 0, "pct": 96 },
              "branches": { "total": 80, "covered": 76, "skipped": 0, "pct": 95 }
            }
          }
          EOF

      - name: Create coverage final JSON
        run: |
          cat > coverage/coverage-final.json << 'EOF'
          {}
          EOF

      - id: action
        uses: .
        with:
          vite-config-path: vitest.config.ts
          json-summary-path: coverage/coverage-summary.json
          json-final-path: coverage/coverage-final.json
          file-coverage-mode: none
          comment-on: none

      - name: Assert action succeeded
        run: |
          echo "Action completed successfully with vite-config-path input"
          echo "PASS"
