name: Test vite-config-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create vite config and coverage files
        run: |
          mkdir -p coverage

          # Create a minimal vitest config file
          cat > vitest.config.ts << 'EOF'
          import { defineConfig } from 'vitest/config'
          export default defineConfig({
            test: {
              coverage: {
                provider: 'v8',
                reporter: ['json-summary', 'json'],
              },
            },
          })
          EOF

          cat > coverage/coverage-summary.json << 'EOF'
          {
            "total": {
              "lines": { "total": 50, "covered": 45, "skipped": 0, "pct": 90 },
              "statements": { "total": 60, "covered": 54, "skipped": 0, "pct": 90 },
              "functions": { "total": 10, "covered": 9, "skipped": 0, "pct": 90 },
              "branches": { "total": 20, "covered": 18, "skipped": 0, "pct": 90 }
            }
          }
          EOF

          cat > coverage/coverage-final.json << 'EOF'
          {}
          EOF

      - id: action
        uses: .
        with:
          vite-config-path: vitest.config.ts
          json-summary-path: coverage/coverage-summary.json
          json-final-path: coverage/coverage-final.json
          file-coverage-mode: none
          comment-on: none

      - name: Assert action completed successfully with vite-config-path
        run: |
          echo "Action completed with vite-config-path input"
          echo "PASS"
