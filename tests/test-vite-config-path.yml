name: Test vite-config-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fake vite config file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/custom-config"
          cat > "$GITHUB_WORKSPACE/custom-config/vite.config.ts" <<'EOF'
          import { defineConfig } from 'vite'
          export default defineConfig({
            test: {
              coverage: {
                provider: 'v8',
                reporter: ['json-summary', 'json'],
              }
            }
          })
          EOF

      - name: Create coverage summary file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/coverage"
          cat > "$GITHUB_WORKSPACE/coverage/coverage-summary.json" <<'EOF'
          {
            "total": {
              "lines": { "total": 100, "covered": 80, "skipped": 0, "pct": 80 },
              "statements": { "total": 100, "covered": 80, "skipped": 0, "pct": 80 },
              "functions": { "total": 20, "covered": 16, "skipped": 0, "pct": 80 },
              "branches": { "total": 40, "covered": 32, "skipped": 0, "pct": 80 }
            }
          }
          EOF

      - name: Create coverage final file
        run: |
          echo '{}' > "$GITHUB_WORKSPACE/coverage/coverage-final.json"

      - id: action
        uses: .
        continue-on-error: true
        with:
          vite-config-path: custom-config/vite.config.ts
          json-summary-path: coverage/coverage-summary.json
          json-final-path: coverage/coverage-final.json
          file-coverage-mode: none
          comment-on: none

      - name: Assert action ran with vite-config-path input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with vite-config-path input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under sentinel repo or missing PR context)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
