name: Test working-directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up coverage files in a subdirectory
        run: |
          mkdir -p packages/my-lib/coverage
          cat > packages/my-lib/coverage/coverage-summary.json << 'EOF'
          {
            "total": {
              "lines": { "total": 100, "covered": 80, "skipped": 0, "pct": 80 },
              "statements": { "total": 100, "covered": 80, "skipped": 0, "pct": 80 },
              "functions": { "total": 50, "covered": 40, "skipped": 0, "pct": 80 },
              "branches": { "total": 40, "covered": 32, "skipped": 0, "pct": 80 }
            }
          }
          EOF
          cat > packages/my-lib/coverage/coverage-final.json << 'EOF'
          {}
          EOF

      - id: action
        uses: .
        with:
          working-directory: packages/my-lib
          file-coverage-mode: none
          comment-on: none

      - name: Assert action completed with working-directory
        run: |
          echo "Action completed with working-directory=packages/my-lib"
          echo "PASS: working-directory input correctly resolved coverage paths"
