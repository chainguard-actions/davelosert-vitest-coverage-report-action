name: Test custom vite-config-path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create coverage fixtures with non-default config location
        run: |
          D="$GITHUB_WORKSPACE/vcr-custom-config"
          mkdir -p "$D/coverage" "$D/configs"
          # A default-named config with different thresholds that must be IGNORED
          cat > "$D/vitest.config.mjs" <<'EOF'
          export default {
            test: {
              coverage: {
                thresholds: { lines: 11, statements: 11, functions: 11, branches: 11 },
              },
            },
          };
          EOF
          # The custom config that vite-config-path points to
          cat > "$D/configs/my-custom.vitest.mjs" <<'EOF'
          export default {
            test: {
              coverage: {
                thresholds: {
                  lines: 77,
                  statements: 66,
                  functions: 55,
                  branches: 44,
                },
              },
            },
          };
          EOF
          cat > "$D/coverage/coverage-summary.json" <<'EOF'
          {
            "total": {
              "lines": { "total": 10, "covered": 8, "skipped": 0, "pct": 80 },
              "statements": { "total": 10, "covered": 8, "skipped": 0, "pct": 80 },
              "functions": { "total": 4, "covered": 3, "skipped": 0, "pct": 75 },
              "branches": { "total": 4, "covered": 2, "skipped": 0, "pct": 50 }
            },
            "/project/src/math.ts": {
              "lines": { "total": 10, "covered": 8, "skipped": 0, "pct": 80 },
              "statements": { "total": 10, "covered": 8, "skipped": 0, "pct": 80 },
              "functions": { "total": 4, "covered": 3, "skipped": 0, "pct": 75 },
              "branches": { "total": 4, "covered": 2, "skipped": 0, "pct": 50 }
            }
          }
          EOF
          cat > "$D/coverage/coverage-final.json" <<'EOF'
          {
            "/project/src/math.ts": {
              "path": "/project/src/math.ts",
              "statementMap": {
                "0": { "start": { "line": 1, "column": 0 }, "end": { "line": 1, "column": 20 } }
              },
              "s": { "0": 1 },
              "fnMap": {}, "f": {}, "branchMap": {}, "b": {}
            }
          }
          EOF
          cat > /tmp/vcr-capture.js <<'EOF'
          const fs = require('fs');
          process.on('exit', () => {
            try {
              const p = process.env.GITHUB_STEP_SUMMARY;
              const out = process.env.VCR_CAPTURE_PATH;
              if (p && out && fs.existsSync(p)) fs.copyFileSync(p, out);
            } catch (e) {}
          });
          EOF
          rm -f /tmp/report-custom-config.md
      - id: action
        uses: .
        env:
          NODE_OPTIONS: --require /tmp/vcr-capture.js
          VCR_CAPTURE_PATH: /tmp/report-custom-config.md
        with:
          working-directory: vcr-custom-config
          vite-config-path: configs/my-custom.vitest.mjs
          name: act-custom-config
          file-coverage-root-path: /project
          file-coverage-mode: none
      - name: Assert action step succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then echo "FAIL: action did not succeed"; exit 1; fi
          echo "PASS"
      - name: Assert thresholds come from the custom config
        run: |
          R=/tmp/report-custom-config.md
          if [ ! -s "$R" ]; then echo "FAIL: captured summary missing/empty"; exit 1; fi
          cat "$R"; echo
          fail=0
          check() { if grep -qF -- "$1" "$R"; then echo "PASS: found '$1'"; else echo "FAIL: missing '$1'"; fail=1; fi; }
          check "Coverage Report for act-custom-config (vcr-custom-config)"
          check "8 / 10"
          check "77%)"
          check "66%)"
          check "55%)"
          check "44%)"
          if grep -qF "11%)" "$R"; then
            echo "FAIL: thresholds from default vitest.config.mjs were used instead of vite-config-path"
            fail=1
          else
            echo "PASS: default config thresholds not used"
          fi
          exit $fail
