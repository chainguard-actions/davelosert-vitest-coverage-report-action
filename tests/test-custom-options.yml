name: Test custom options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create coverage summary file
        run: |
          mkdir -p coverage
          cat > coverage/coverage-summary.json << 'EOF'
          {
            "total": {
              "lines": { "total": 200, "covered": 150, "skipped": 0, "pct": 75 },
              "statements": { "total": 200, "covered": 150, "skipped": 0, "pct": 75 },
              "functions": { "total": 40, "covered": 30, "skipped": 0, "pct": 75 },
              "branches": { "total": 80, "covered": 60, "skipped": 0, "pct": 75 }
            }
          }
          EOF

      - name: Create coverage final file
        run: |
          cat > coverage/coverage-final.json << 'EOF'
          {}
          EOF

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          json-summary-path: coverage/coverage-summary.json
          json-final-path: coverage/coverage-final.json
          file-coverage-mode: none
          comment-on: none
          sort-by: statements-asc
          show-uncovered-lines: 'false'
          file-coverage-expanded: 'true'
          comparison-decimal-places: '3'
          name: 'my-coverage-report'

      - name: Assert action completed successfully
        run: |
          echo "Action with custom options completed without error"
          echo "PASS"
