name: Test threshold icons and custom name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create coverage summary JSON
        run: |
          mkdir -p coverage
          cat > coverage/coverage-summary.json << 'EOF'
          {
            "total": {
              "lines": { "total": 100, "covered": 95, "skipped": 0, "pct": 95 },
              "statements": { "total": 120, "covered": 114, "skipped": 0, "pct": 95 },
              "functions": { "total": 30, "covered": 29, "skipped": 0, "pct": 96.67 },
              "branches": { "total": 40, "covered": 38, "skipped": 0, "pct": 95 }
            }
          }
          EOF

      - name: Create coverage final JSON
        run: |
          cat > coverage/coverage-final.json << 'EOF'
          {}
          EOF

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          json-summary-path: coverage/coverage-summary.json
          json-final-path: coverage/coverage-final.json
          file-coverage-mode: none
          comment-on: none
          name: 'Unit Tests'
          threshold-icons: '{"0": "🔴", "80": "🟠", "90": "🟢"}'
          comparison-decimal-places: '3'

      - name: Assert action completed with threshold icons
        run: |
          echo "Action completed with threshold-icons and custom name"
          echo "PASS"
