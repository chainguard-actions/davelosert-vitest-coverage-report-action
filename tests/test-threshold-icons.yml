name: Test custom threshold icons with no file coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create coverage fixtures and summary capture hook
        run: |
          D="$GITHUB_WORKSPACE/vcr-fixture-icons"
          mkdir -p "$D/coverage"
          cat > "$D/coverage/coverage-summary.json" <<'EOF'
          {
            "total": {
              "lines": { "total": 10, "covered": 8, "skipped": 0, "pct": 80 },
              "statements": { "total": 10, "covered": 8, "skipped": 0, "pct": 80 },
              "functions": { "total": 4, "covered": 3, "skipped": 0, "pct": 75 },
              "branches": { "total": 4, "covered": 2, "skipped": 0, "pct": 50 }
            }
          }
          EOF
          echo '{}' > "$D/coverage/coverage-final.json"
          cat > /tmp/vcr-capture.js <<'EOF'
          const fs = require('fs');
          process.on('exit', () => {
            try {
              const p = process.env.GITHUB_STEP_SUMMARY;
              const out = process.env.VCR_CAPTURE_PATH;
              if (p && out && fs.existsSync(p)) fs.copyFileSync(p, out);
            } catch (e) {}
          });
          EOF
          rm -f /tmp/report-icons.md
      - id: action
        uses: .
        env:
          NODE_OPTIONS: --require /tmp/vcr-capture.js
          VCR_CAPTURE_PATH: /tmp/report-icons.md
        with:
          working-directory: vcr-fixture-icons
          name: act-icons
          file-coverage-mode: none
          threshold-icons: "{0: '🔴', 80: '🟠', 90: '🟢'}"
          comment-on: none
      - name: Assert action step succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then echo "FAIL: action did not succeed"; exit 1; fi
          echo "PASS"
      - name: Assert summary contents
        run: |
          R=/tmp/report-icons.md
          if [ ! -s "$R" ]; then echo "FAIL: captured summary missing/empty"; exit 1; fi
          cat "$R"; echo
          fail=0
          check() { if grep -qF -- "$1" "$R"; then echo "PASS: found '$1'"; else echo "FAIL: missing '$1'"; fail=1; fi; }
          check "Coverage Report for act-icons"
          # lines/statements 80% => orange, functions/branches < 80 => red
          check "🟠"
          check "🔴"
          check "Covered / Total"
          if grep -qF "🟢" "$R"; then echo "FAIL: no metric reaches 90%, green unexpected"; fail=1; else echo "PASS: no green"; fi
          if grep -qF "File Coverage" "$R"; then echo "FAIL: file coverage should be omitted in 'none' mode"; fail=1; else echo "PASS: no file coverage"; fi
          exit $fail
