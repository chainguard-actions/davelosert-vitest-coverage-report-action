name: Test file-coverage-mode all
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create coverage summary file
        run: |
          mkdir -p coverage
          cat > coverage/coverage-summary.json << 'EOF'
          {
            "total": {
              "lines": { "total": 50, "covered": 45, "skipped": 0, "pct": 90 },
              "statements": { "total": 50, "covered": 45, "skipped": 0, "pct": 90 },
              "functions": { "total": 10, "covered": 9, "skipped": 0, "pct": 90 },
              "branches": { "total": 20, "covered": 18, "skipped": 0, "pct": 90 }
            },
            "/github/workspace/src/index.ts": {
              "lines": { "total": 50, "covered": 45, "skipped": 0, "pct": 90 },
              "statements": { "total": 50, "covered": 45, "skipped": 0, "pct": 90 },
              "functions": { "total": 10, "covered": 9, "skipped": 0, "pct": 90 },
              "branches": { "total": 20, "covered": 18, "skipped": 0, "pct": 90 }
            }
          }
          EOF

      - name: Create coverage final file
        run: |
          cat > coverage/coverage-final.json << 'EOF'
          {
            "/github/workspace/src/index.ts": {
              "path": "/github/workspace/src/index.ts",
              "statementMap": {},
              "fnMap": {},
              "branchMap": {},
              "s": {},
              "f": {},
              "b": {}
            }
          }
          EOF

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          json-summary-path: coverage/coverage-summary.json
          json-final-path: coverage/coverage-final.json
          file-coverage-mode: all
          comment-on: none

      - name: Assert action completed successfully
        run: |
          echo "Action with file-coverage-mode=all completed without error"
          echo "PASS"
