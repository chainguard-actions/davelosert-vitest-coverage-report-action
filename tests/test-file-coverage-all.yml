name: Test file-coverage-mode all
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create coverage summary JSON with file entries
        run: |
          mkdir -p coverage
          cat > coverage/coverage-summary.json << 'EOF'
          {
            "total": {
              "lines": { "total": 200, "covered": 180, "skipped": 0, "pct": 90 },
              "statements": { "total": 200, "covered": 180, "skipped": 0, "pct": 90 },
              "functions": { "total": 40, "covered": 36, "skipped": 0, "pct": 90 },
              "branches": { "total": 80, "covered": 72, "skipped": 0, "pct": 90 }
            },
            "/github/workspace/src/index.ts": {
              "lines": { "total": 100, "covered": 90, "skipped": 0, "pct": 90 },
              "statements": { "total": 100, "covered": 90, "skipped": 0, "pct": 90 },
              "functions": { "total": 20, "covered": 18, "skipped": 0, "pct": 90 },
              "branches": { "total": 40, "covered": 36, "skipped": 0, "pct": 90 }
            },
            "/github/workspace/src/utils.ts": {
              "lines": { "total": 100, "covered": 90, "skipped": 0, "pct": 90 },
              "statements": { "total": 100, "covered": 90, "skipped": 0, "pct": 90 },
              "functions": { "total": 20, "covered": 18, "skipped": 0, "pct": 90 },
              "branches": { "total": 40, "covered": 36, "skipped": 0, "pct": 90 }
            }
          }
          EOF

      - name: Create coverage final JSON
        run: |
          cat > coverage/coverage-final.json << 'EOF'
          {}
          EOF

      - id: action
        uses: .
        with:
          json-summary-path: coverage/coverage-summary.json
          json-final-path: coverage/coverage-final.json
          file-coverage-mode: all
          comment-on: none

      - name: Assert action succeeded with all file coverage mode
        run: |
          echo "Action completed successfully with file-coverage-mode: all"
          echo "PASS"
