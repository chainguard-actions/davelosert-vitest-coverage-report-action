name: Test coverage comparison with previous run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create coverage files
        run: |
          mkdir -p coverage coverage-base
          cat > coverage/coverage-summary.json << 'EOF'
          {
            "total": {
              "lines": { "total": 100, "covered": 85, "skipped": 0, "pct": 85 },
              "statements": { "total": 120, "covered": 100, "skipped": 0, "pct": 83.33 },
              "functions": { "total": 30, "covered": 25, "skipped": 0, "pct": 83.33 },
              "branches": { "total": 40, "covered": 32, "skipped": 0, "pct": 80 }
            }
          }
          EOF
          cat > coverage/coverage-final.json << 'EOF'
          {}
          EOF
          cat > coverage-base/coverage-summary.json << 'EOF'
          {
            "total": {
              "lines": { "total": 100, "covered": 80, "skipped": 0, "pct": 80 },
              "statements": { "total": 120, "covered": 95, "skipped": 0, "pct": 79.17 },
              "functions": { "total": 30, "covered": 22, "skipped": 0, "pct": 73.33 },
              "branches": { "total": 40, "covered": 28, "skipped": 0, "pct": 70 }
            }
          }
          EOF

      - id: action
        uses: .
        with:
          json-summary-path: coverage/coverage-summary.json
          json-summary-compare-path: coverage-base/coverage-summary.json
          json-final-path: coverage/coverage-final.json
          file-coverage-mode: none
          comment-on: none
          comparison-decimal-places: '2'

      - name: Assert action completed with comparison
        run: |
          echo "Action completed with coverage comparison"
          echo "PASS"
