name: Test comment-on commit
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare coverage files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/coverage"
          cp "$GITHUB_WORKSPACE/tests/fixtures/coverage-simple/coverage-summary.json" \
             "$GITHUB_WORKSPACE/coverage/coverage-summary.json"
          cp "$GITHUB_WORKSPACE/tests/fixtures/coverage-simple/coverage-final.json" \
             "$GITHUB_WORKSPACE/coverage/coverage-final.json"
          echo "Coverage files prepared"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          json-summary-path: ${{ github.workspace }}/coverage/coverage-summary.json
          json-final-path: ${{ github.workspace }}/coverage/coverage-final.json
          file-coverage-mode: none
          comment-on: commit

      - name: Assert action ran (comment may fail on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded and posted commit comment"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable for commit comments)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
