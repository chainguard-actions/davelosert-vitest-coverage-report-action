name: Test json-summary-compare-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create current coverage summary file
        run: |
          mkdir -p coverage
          cat > coverage/coverage-summary.json << 'EOF'
          {
            "total": {
              "lines": { "total": 100, "covered": 85, "skipped": 0, "pct": 85 },
              "statements": { "total": 100, "covered": 85, "skipped": 0, "pct": 85 },
              "functions": { "total": 20, "covered": 17, "skipped": 0, "pct": 85 },
              "branches": { "total": 40, "covered": 34, "skipped": 0, "pct": 85 }
            }
          }
          EOF

      - name: Create previous coverage summary file for comparison
        run: |
          mkdir -p coverage
          cat > coverage/coverage-summary-previous.json << 'EOF'
          {
            "total": {
              "lines": { "total": 100, "covered": 80, "skipped": 0, "pct": 80 },
              "statements": { "total": 100, "covered": 80, "skipped": 0, "pct": 80 },
              "functions": { "total": 20, "covered": 16, "skipped": 0, "pct": 80 },
              "branches": { "total": 40, "covered": 32, "skipped": 0, "pct": 80 }
            }
          }
          EOF

      - name: Create coverage final file
        run: |
          cat > coverage/coverage-final.json << 'EOF'
          {}
          EOF

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          json-summary-path: coverage/coverage-summary.json
          json-summary-compare-path: coverage/coverage-summary-previous.json
          json-final-path: coverage/coverage-final.json
          file-coverage-mode: none
          comment-on: none

      - name: Assert action completed successfully with compare path
        run: |
          echo "Action with json-summary-compare-path completed without error"
          echo "PASS"
