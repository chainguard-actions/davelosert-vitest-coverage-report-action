name: Test sort-by coverage metric
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create coverage files
        run: |
          mkdir -p coverage
          WORKSPACE_PATH="${GITHUB_WORKSPACE}"
          cat > coverage/coverage-summary.json << EOF
          {
            "total": {
              "lines": { "total": 100, "covered": 85, "skipped": 0, "pct": 85 },
              "statements": { "total": 120, "covered": 100, "skipped": 0, "pct": 83.33 },
              "functions": { "total": 30, "covered": 25, "skipped": 0, "pct": 83.33 },
              "branches": { "total": 40, "covered": 32, "skipped": 0, "pct": 80 }
            },
            "${WORKSPACE_PATH}/src/index.ts": {
              "lines": { "total": 50, "covered": 45, "skipped": 0, "pct": 90 },
              "statements": { "total": 60, "covered": 54, "skipped": 0, "pct": 90 },
              "functions": { "total": 10, "covered": 9, "skipped": 0, "pct": 90 },
              "branches": { "total": 20, "covered": 18, "skipped": 0, "pct": 90 }
            },
            "${WORKSPACE_PATH}/src/utils.ts": {
              "lines": { "total": 50, "covered": 40, "skipped": 0, "pct": 80 },
              "statements": { "total": 60, "covered": 46, "skipped": 0, "pct": 76.67 },
              "functions": { "total": 20, "covered": 16, "skipped": 0, "pct": 80 },
              "branches": { "total": 20, "covered": 14, "skipped": 0, "pct": 70 }
            }
          }
          EOF
          cat > coverage/coverage-final.json << 'EOF'
          {}
          EOF

      - id: action
        uses: .
        with:
          json-summary-path: coverage/coverage-summary.json
          json-final-path: coverage/coverage-final.json
          file-coverage-mode: all
          comment-on: none
          sort-by: 'statements-asc'
          show-uncovered-lines: 'false'

      - name: Assert action completed with sort-by statements-asc
        run: |
          echo "Action completed with sort-by=statements-asc and show-uncovered-lines=false"
          echo "PASS"
