name: Test json-summary-compare-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run vitest coverage report action with json-summary-compare-path
        id: action
        uses: .
        with:
          github-token: fake-token
          json-summary-path: >-
            ${{ github.workspace }}/actions/hardened/davelosert--vitest-coverage-report-action/v2.12.0/tests/fixtures/coverage/coverage-summary.json
          json-summary-compare-path: >-
            ${{ github.workspace }}/actions/hardened/davelosert--vitest-coverage-report-action/v2.12.0/tests/fixtures/coverage/coverage-summary-compare.json
          file-coverage-mode: none
          comment-on: none
      - name: Assert action completed successfully with compare path
        run: |
          echo "Action completed successfully with json-summary-compare-path"
          echo "PASS"
