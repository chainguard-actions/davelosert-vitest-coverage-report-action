name: Test with vitest thresholds
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up coverage files and vite config
        run: |
          mkdir -p coverage
          cat > coverage/coverage-summary.json << 'EOF'
          {
            "total": {
              "lines": { "total": 100, "covered": 80, "skipped": 0, "pct": 80 },
              "statements": { "total": 100, "covered": 80, "skipped": 0, "pct": 80 },
              "functions": { "total": 50, "covered": 40, "skipped": 0, "pct": 80 },
              "branches": { "total": 40, "covered": 32, "skipped": 0, "pct": 80 }
            }
          }
          EOF
          cat > coverage/coverage-final.json << 'EOF'
          {}
          EOF
          cat > vitest.config.js << 'EOF'
          export default {
            test: {
              coverage: {
                thresholds: {
                  lines: 70,
                  statements: 70,
                  functions: 70,
                  branches: 70
                }
              }
            }
          };
          EOF

      - id: action
        uses: .
        with:
          json-summary-path: coverage/coverage-summary.json
          json-final-path: coverage/coverage-final.json
          vite-config-path: vitest.config.js
          file-coverage-mode: none
          comment-on: none

      - name: Assert action completed with thresholds
        run: |
          echo "Action completed with vitest thresholds"
          echo "PASS: action ran with vite config thresholds (80% coverage meets 70% threshold)"
