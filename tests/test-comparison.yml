name: Test coverage comparison
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up coverage files
        run: |
          mkdir -p coverage
          cat > coverage/coverage-summary.json << 'EOF'
          {
            "total": {
              "lines": { "total": 100, "covered": 80, "skipped": 0, "pct": 80 },
              "statements": { "total": 100, "covered": 80, "skipped": 0, "pct": 80 },
              "functions": { "total": 50, "covered": 40, "skipped": 0, "pct": 80 },
              "branches": { "total": 40, "covered": 32, "skipped": 0, "pct": 80 }
            }
          }
          EOF
          cat > coverage/coverage-summary-compare.json << 'EOF'
          {
            "total": {
              "lines": { "total": 100, "covered": 70, "skipped": 0, "pct": 70 },
              "statements": { "total": 100, "covered": 70, "skipped": 0, "pct": 70 },
              "functions": { "total": 50, "covered": 35, "skipped": 0, "pct": 70 },
              "branches": { "total": 40, "covered": 28, "skipped": 0, "pct": 70 }
            }
          }
          EOF
          cat > coverage/coverage-final.json << 'EOF'
          {}
          EOF

      - id: action
        uses: .
        with:
          json-summary-path: coverage/coverage-summary.json
          json-summary-compare-path: coverage/coverage-summary-compare.json
          json-final-path: coverage/coverage-final.json
          file-coverage-mode: none
          comment-on: none
          comparison-decimal-places: '2'

      - name: Assert action completed successfully
        run: |
          echo "Action completed with comparison coverage"
          echo "PASS: comparison mode succeeded (current 80% vs previous 70%)"
