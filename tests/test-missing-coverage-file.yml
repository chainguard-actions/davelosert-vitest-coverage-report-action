name: Test missing coverage file error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          json-summary-path: coverage/nonexistent-coverage-summary.json
          json-final-path: coverage/nonexistent-coverage-final.json
          file-coverage-mode: none
          comment-on: none
        continue-on-error: true

      - name: Assert action fails when coverage file is missing
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when coverage file is missing"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed with missing coverage file"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
