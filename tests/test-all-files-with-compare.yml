name: Test all files mode with comparison report
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create coverage fixtures and summary capture hook
        run: |
          D="$GITHUB_WORKSPACE/vcr-fixture-compare"
          mkdir -p "$D/coverage"
          cat > "$D/coverage/coverage-summary.json" <<'EOF'
          {
            "total": {
              "lines": { "total": 10, "covered": 8, "skipped": 0, "pct": 80 },
              "statements": { "total": 10, "covered": 8, "skipped": 0, "pct": 80 },
              "functions": { "total": 4, "covered": 3, "skipped": 0, "pct": 75 },
              "branches": { "total": 4, "covered": 2, "skipped": 0, "pct": 50 }
            },
            "/project/src/math.ts": {
              "lines": { "total": 6, "covered": 6, "skipped": 0, "pct": 100 },
              "statements": { "total": 6, "covered": 6, "skipped": 0, "pct": 100 },
              "functions": { "total": 2, "covered": 2, "skipped": 0, "pct": 100 },
              "branches": { "total": 2, "covered": 2, "skipped": 0, "pct": 100 }
            },
            "/project/src/util.ts": {
              "lines": { "total": 4, "covered": 2, "skipped": 0, "pct": 50 },
              "statements": { "total": 4, "covered": 2, "skipped": 0, "pct": 50 },
              "functions": { "total": 2, "covered": 1, "skipped": 0, "pct": 50 },
              "branches": { "total": 2, "covered": 0, "skipped": 0, "pct": 0 }
            }
          }
          EOF
          cat > "$D/coverage/coverage-summary-compare.json" <<'EOF'
          {
            "total": {
              "lines": { "total": 10, "covered": 7, "skipped": 0, "pct": 70 },
              "statements": { "total": 10, "covered": 7, "skipped": 0, "pct": 70 },
              "functions": { "total": 4, "covered": 3, "skipped": 0, "pct": 75 },
              "branches": { "total": 4, "covered": 2, "skipped": 0, "pct": 50 }
            },
            "/project/src/math.ts": {
              "lines": { "total": 6, "covered": 6, "skipped": 0, "pct": 100 },
              "statements": { "total": 6, "covered": 6, "skipped": 0, "pct": 100 },
              "functions": { "total": 2, "covered": 2, "skipped": 0, "pct": 100 },
              "branches": { "total": 2, "covered": 2, "skipped": 0, "pct": 100 }
            },
            "/project/src/util.ts": {
              "lines": { "total": 4, "covered": 1, "skipped": 0, "pct": 25 },
              "statements": { "total": 4, "covered": 1, "skipped": 0, "pct": 25 },
              "functions": { "total": 2, "covered": 1, "skipped": 0, "pct": 50 },
              "branches": { "total": 2, "covered": 0, "skipped": 0, "pct": 0 }
            }
          }
          EOF
          cat > "$D/coverage/coverage-final.json" <<'EOF'
          {
            "/project/src/math.ts": {
              "path": "/project/src/math.ts",
              "statementMap": {
                "0": { "start": { "line": 1, "column": 0 }, "end": { "line": 1, "column": 20 } },
                "1": { "start": { "line": 2, "column": 0 }, "end": { "line": 2, "column": 20 } }
              },
              "s": { "0": 1, "1": 1 },
              "fnMap": {}, "f": {}, "branchMap": {}, "b": {}
            },
            "/project/src/util.ts": {
              "path": "/project/src/util.ts",
              "statementMap": {
                "0": { "start": { "line": 1, "column": 0 }, "end": { "line": 1, "column": 20 } },
                "1": { "start": { "line": 2, "column": 0 }, "end": { "line": 2, "column": 20 } },
                "2": { "start": { "line": 3, "column": 0 }, "end": { "line": 3, "column": 20 } },
                "3": { "start": { "line": 4, "column": 0 }, "end": { "line": 4, "column": 20 } }
              },
              "s": { "0": 1, "1": 1, "2": 0, "3": 0 },
              "fnMap": {}, "f": {}, "branchMap": {}, "b": {}
            }
          }
          EOF
          cat > /tmp/vcr-capture.js <<'EOF'
          const fs = require('fs');
          process.on('exit', () => {
            try {
              const p = process.env.GITHUB_STEP_SUMMARY;
              const out = process.env.VCR_CAPTURE_PATH;
              if (p && out && fs.existsSync(p)) fs.copyFileSync(p, out);
            } catch (e) {}
          });
          EOF
          rm -f /tmp/report-compare.md
      - id: action
        uses: .
        env:
          NODE_OPTIONS: --require /tmp/vcr-capture.js
          VCR_CAPTURE_PATH: /tmp/report-compare.md
        with:
          working-directory: vcr-fixture-compare
          name: act-compare
          json-summary-compare-path: coverage/coverage-summary-compare.json
          file-coverage-mode: all
          file-coverage-expanded: 'true'
          file-coverage-root-path: /project
          comparison-decimal-places: '1'
          comment-on: none
      - name: Assert action step succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then echo "FAIL: action did not succeed"; exit 1; fi
          echo "PASS"
      - name: Assert summary contents
        run: |
          R=/tmp/report-compare.md
          if [ ! -s "$R" ]; then echo "FAIL: captured summary missing/empty"; exit 1; fi
          cat "$R"; echo
          fail=0
          check() { if grep -qF -- "$1" "$R"; then echo "PASS: found '$1'"; else echo "FAIL: missing '$1'"; fail=1; fi; }
          check "Coverage Report for act-compare"
          # total lines 80 vs 70 => +10.0 pp with 1 decimal place
          check "+10.0 pp"
          check "±0 pp"
          check "Affected Files"
          check "Unchanged Files"
          check "src/util.ts"
          check "src/math.ts"
          check "+25.0 pp"
          check "<details open><summary>File Coverage</summary>"
          check "Uncovered Lines"
          check ">3-4</a>"
          if grep -qF "+10.00 pp" "$R"; then echo "FAIL: expected 1 decimal place"; fail=1; fi
          exit $fail
