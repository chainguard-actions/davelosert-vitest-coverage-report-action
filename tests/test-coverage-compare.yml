name: Test coverage comparison with json-summary-compare-path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare environment
        run: |
          touch /tmp/step-summary.md
          echo "GITHUB_STEP_SUMMARY=/tmp/step-summary.md" >> "$GITHUB_ENV"

      - id: action
        uses: .
        with:
          json-summary-path: tests/fixtures/coverage/coverage-summary.json
          json-final-path: tests/fixtures/coverage/coverage-final.json
          json-summary-compare-path: tests/fixtures/coverage/coverage-summary-previous.json
          file-coverage-mode: none
          comment-on: none
        continue-on-error: true

      - name: Assert action completed with coverage comparison
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with coverage comparison"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or environment issue)"
          elif [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was unexpectedly skipped"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
