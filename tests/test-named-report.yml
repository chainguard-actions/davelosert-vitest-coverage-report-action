name: Test named coverage report
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create coverage files for named report
        run: |
          mkdir -p coverage
          cat > coverage/coverage-summary.json << 'EOF'
          {
            "total": {
              "lines": { "total": 100, "covered": 95, "skipped": 0, "pct": 95 },
              "statements": { "total": 200, "covered": 190, "skipped": 0, "pct": 95 },
              "functions": { "total": 50, "covered": 47, "skipped": 0, "pct": 94 },
              "branches": { "total": 40, "covered": 38, "skipped": 0, "pct": 95 }
            }
          }
          EOF
          cat > coverage/coverage-final.json << 'EOF'
          {}
          EOF
          # Create a compare file with slightly lower coverage
          cat > coverage/coverage-summary-compare.json << 'EOF'
          {
            "total": {
              "lines": { "total": 100, "covered": 90, "skipped": 0, "pct": 90 },
              "statements": { "total": 200, "covered": 180, "skipped": 0, "pct": 90 },
              "functions": { "total": 50, "covered": 45, "skipped": 0, "pct": 90 },
              "branches": { "total": 40, "covered": 36, "skipped": 0, "pct": 90 }
            }
          }
          EOF

      - id: action
        uses: .
        with:
          name: unit-tests
          json-summary-path: coverage/coverage-summary.json
          json-summary-compare-path: coverage/coverage-summary-compare.json
          json-final-path: coverage/coverage-final.json
          file-coverage-mode: none
          comment-on: none

      - name: Assert named report completed successfully
        run: |
          echo "Named coverage report action completed"
          echo "PASS"
