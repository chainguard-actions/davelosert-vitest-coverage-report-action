name: Test basic coverage report
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create coverage summary JSON
        run: |
          mkdir -p coverage
          cat > coverage/coverage-summary.json << 'EOF'
          {
            "total": {
              "lines": { "total": 100, "covered": 85, "skipped": 0, "pct": 85 },
              "statements": { "total": 120, "covered": 100, "skipped": 0, "pct": 83.33 },
              "functions": { "total": 30, "covered": 25, "skipped": 0, "pct": 83.33 },
              "branches": { "total": 40, "covered": 32, "skipped": 0, "pct": 80 }
            },
            "src/index.ts": {
              "lines": { "total": 50, "covered": 45, "skipped": 0, "pct": 90 },
              "statements": { "total": 60, "covered": 54, "skipped": 0, "pct": 90 },
              "functions": { "total": 15, "covered": 14, "skipped": 0, "pct": 93.33 },
              "branches": { "total": 20, "covered": 18, "skipped": 0, "pct": 90 }
            },
            "src/utils.ts": {
              "lines": { "total": 50, "covered": 40, "skipped": 0, "pct": 80 },
              "statements": { "total": 60, "covered": 46, "skipped": 0, "pct": 76.67 },
              "functions": { "total": 15, "covered": 11, "skipped": 0, "pct": 73.33 },
              "branches": { "total": 20, "covered": 14, "skipped": 0, "pct": 70 }
            }
          }
          EOF

      - name: Create coverage final JSON
        run: |
          cat > coverage/coverage-final.json << 'EOF'
          {
            "src/index.ts": {
              "path": "src/index.ts",
              "statementMap": {},
              "fnMap": {},
              "branchMap": {},
              "s": {},
              "f": {},
              "b": {}
            }
          }
          EOF

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          json-summary-path: coverage/coverage-summary.json
          json-final-path: coverage/coverage-final.json
          file-coverage-mode: all
          comment-on: none

      - name: Assert action completed successfully
        run: |
          echo "Action completed without error"
          echo "PASS"
